<style>
  :root {
    --navy: #223E57;
    --cream: #F1EADC;
    --bg: #08101A;
    --ink: rgba(241, 234, 220, .94);
    --ink-2: rgba(241, 234, 220, .58);
    --ink-3: rgba(241, 234, 220, .34);
    --line: rgba(241, 234, 220, .11);
    --card: rgba(241, 234, 220, .045);
    --card-hover: rgba(241, 234, 220, .085);
    --line-green: #06C755;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }

  /* 背景：畫布畫 K 線、均線、極光、浮點（bg.js） */
  .bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .grain {
    position: absolute; inset: -50%; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .wrap {
    position: relative; z-index: 1;
    max-width: 460px; margin: 0 auto;
    padding: calc(56px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  }

  /* 右上分享 */
  .share {
    position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 16px;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); color: var(--ink-2);
    cursor: pointer; transition: background .2s, color .2s, transform .15s;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .share:hover { background: var(--card-hover); color: var(--ink); }
  .share:active { transform: scale(.92); }
  .share svg { width: 18px; height: 18px; }

  /* 頭像 */
  .hero { text-align: center; }
  .avatar {
    position: relative; width: 116px; height: 116px; margin: 0 auto 18px;
    border-radius: 50%;
    background: #F5D417;
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px rgba(255, 214, 90, .25), 0 0 70px rgba(255, 196, 40, .28), 0 18px 50px rgba(0, 0, 0, .45);
  }
  .avatar img {
    width: 86%; height: 86%; object-fit: contain;
    filter: drop-shadow(0 0 2px rgba(241, 234, 220, .55)) drop-shadow(0 0 7px rgba(241, 234, 220, .28));
  }
  .avatar img.photo { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; filter: none; transform: scale(1.04); }
  .avatar { overflow: visible; }
  .avatar .clip { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
  .avatar .ring {
    position: absolute; inset: -7px; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255, 214, 90, 0), rgba(255, 214, 90, .75) 22%, rgba(255, 214, 90, 0) 40%, rgba(80, 150, 210, 0) 55%, rgba(80, 150, 210, .7) 75%, rgba(80, 150, 210, 0) 92%);
    -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
            mask: radial-gradient(closest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px));
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .name {
    font-family: "EB Garamond", Georgia, "Times New Roman", serif;
    font-style: italic; font-weight: 500;
    font-size: 38px; letter-spacing: .5px; line-height: 1.1;
  }
  .sub { margin-top: 6px; font-size: 14px; color: var(--ink-2); letter-spacing: 1px; }
  .sub i { font-style: normal; color: var(--ink-3); margin: 0 6px; }
  .bio { margin-top: 14px; font-size: 15px; line-height: 1.75; color: rgba(241, 234, 220, .8); }

  /* 頭像下的小圖示列 */
  .quick { display: flex; justify-content: center; gap: 12px; margin-top: 22px; }
  .quick a {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    transition: background .2s, transform .15s;
  }
  .quick a:hover { background: var(--card-hover); transform: translateY(-2px); }
  .quick a:active { transform: scale(.92); }
  .quick svg { width: 20px; height: 20px; }

  /* 欄位 */
  section { margin-top: 34px; }
  h2 {
    font-size: 12px; font-weight: 500; letter-spacing: 3px;
    color: var(--ink-2); margin: 0 4px 12px;
    text-shadow: 0 1px 8px rgba(8, 16, 26, .9);
  }
  .list { display: grid; gap: 10px; }
  .card {
    position: relative; display: flex; align-items: center; gap: 14px;
    min-height: 72px; padding: 14px 16px 14px 14px;
    border-radius: 18px;
    background: var(--card); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: background .2s, border-color .2s, transform .15s;
  }
  a.card:hover { background: var(--card-hover); border-color: rgba(241, 234, 220, .2); }
  a.card:active { transform: scale(.98); }
  .ico {
    flex: none; width: 44px; height: 44px; border-radius: 13px;
    display: grid; place-items: center;
    background: rgba(241, 234, 220, .07); color: var(--ink);
  }
  .ico svg { width: 22px; height: 22px; }
  .txt { flex: 1; min-width: 0; }
  .t { font-size: 16px; font-weight: 500; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
  .t small { font-size: 12px; font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
  .d { margin-top: 3px; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  .go { flex: none; width: 18px; height: 18px; color: var(--ink-3); transition: transform .2s, color .2s; }
  a.card:hover .go { transform: translate(2px, -2px); color: var(--ink); }

  /* LINE 社群：主要的那張 */
  .card.feature {
    background: var(--cream); color: #14222F; border-color: transparent;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  .card.feature:hover { background: #F7F1E6; }
  .card.feature .ico { background: var(--line-green); color: #fff; }
  .card.feature .d { color: rgba(20, 34, 47, .62); }
  .card.feature .go { color: rgba(20, 34, 47, .45); }
  .card.feature:hover .go { color: #14222F; }
  .card.feature::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 60%; left: -80%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent);
    animation: sheen 5.5s ease-in-out 1.6s infinite;
  }
  @keyframes sheen { 0% { left: -80%; } 22%, 100% { left: 130%; } }

  .tag {
    font-size: 11px; font-weight: 500; letter-spacing: 1px;
    padding: 3px 8px; border-radius: 99px;
    border: 1px solid rgba(241, 234, 220, .25); color: var(--ink-2);
  }

  footer { margin-top: 44px; text-align: center; color: var(--ink-3); font-size: 12px; letter-spacing: 1px; }
  footer img { width: 26px; height: 26px; display: block; margin: 0 auto 10px; border-radius: 50%; opacity: .9; }

  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); z-index: 5;
    transform: translate(-50%, 20px); opacity: 0;
    padding: 10px 18px; border-radius: 99px;
    background: var(--cream); color: #14222F; font-size: 14px; font-weight: 500;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
    transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* 進場：一層一層浮上來 */
  .rise { opacity: 0; transform: translateY(14px); animation: rise .7s cubic-bezier(.2, .7, .2, 1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .avatar .ring, .card.feature::after { animation: none; }
    .rise { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<script src="bg.js"></script>
<script>
  startBg(document.getElementById("bg"));

  // 網址都在這裡改。空字串＝還沒設定，點了會提示。
  const LINKS = {
    line: "https://line.me/ti/g2/FXj0yahd04U4JecSoC4uPInXiqhLulqdCl54Ag",  // OX.Trading AI 討論群
    ig: "https://www.instagram.com/btcfly/",
    x: "",         // https://x.com/帳號
    threads: "https://www.threads.com/@ox.trading.ai",
    yt: "https://www.youtube.com/@snsheng"
  };

  const toast = document.querySelector(".toast");
  let toastTimer;
  function say(msg) {
    toast.textContent = msg;
    toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("on"), 1800);
  }

  document.querySelectorAll("a[data-key]").forEach(a => {
    const key = a.dataset.key;
    if (key in LINKS) {
      if (LINKS[key]) a.href = LINKS[key];
      else a.addEventListener("click", e => { e.preventDefault(); say("這個連結還沒開放"); });
    }
    if (a.href && !a.href.endsWith("#")) { a.target = "_blank"; a.rel = "noopener"; }
  });

  // 進場一層一層浮上來
  document.querySelectorAll(".rise").forEach((el, i) => { el.style.animationDelay = (0.06 * i) + "s"; });

  // 分享：手機叫出分享選單，電腦就複製網址
  document.querySelector(".share").addEventListener("click", async () => {
    const data = { title: document.title, url: location.href };
    if (navigator.share) {
      try { await navigator.share(data); } catch (e) {}
      return;
    }
    try { await navigator.clipboard.writeText(location.href); say("網址已複製"); }
    catch (e) { say(location.href); }
  });
</script>
</body>
</html>
